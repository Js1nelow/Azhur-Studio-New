  <!-- Ceiling Plane Datum Line (Off-White Alabaster) -->
  <line x1="4" y1="5" x2="30" y2="5" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Shadow Gap Profile Accent (EuroKRAAB Terracotta) -->
